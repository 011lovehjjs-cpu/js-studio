<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JS STUDIO</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#120F1C">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JS STUDIO">

<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;background:#120F1C;}
  body{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh;
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif; color:#fff;
    padding:32px 24px; text-align:center;
  }
  .play{
    width:0; height:0; margin:0 auto 14px;
    border-left:34px solid #7A54F0;
    border-top:22px solid transparent;
    border-bottom:22px solid transparent;
  }
  .name{font-weight:800; font-size:19px; letter-spacing:0.16em; margin-bottom:6px;}
  .tag{font-size:12px; color:#8B84A3; margin-bottom:34px;}
  .btn{
    display:block; width:100%; max-width:300px; margin:0 auto 10px;
    padding:15px 20px; border-radius:14px; border:none;
    font-weight:700; font-size:15px; cursor:pointer;
    font-family:inherit; text-decoration:none; text-align:center;
  }
  .btn-main{background:#7A54F0; color:#fff;}
  .btn-sub{background:transparent; color:#B9B2CF; border:1px solid #3A3350;}
  .hint{
    max-width:320px; margin:22px auto 0; font-size:12px; color:#8B84A3; line-height:1.8;
    background:rgba(255,255,255,0.04); border-radius:12px; padding:14px 16px; text-align:left;
  }
  .hint b{color:#D8D3E8;}
  .ok{color:#67D6B5; font-size:12px; margin-top:8px;}
  #installWrap{display:none;}
</style>
</head>
<body>

<div class="play"></div>
<div class="name">JS STUDIO</div>
<div class="tag">프리랜서 영상 관리</div>

<a class="btn btn-main" id="go" href="#">스튜디오 열기</a>

<div id="installWrap">
  <button class="btn btn-sub" id="install">홈 화면에 앱으로 설치</button>
</div>

<div class="hint" id="hint"></div>

<script>
/* JS STUDIO 웹앱 주소 */
var APP_URL = "https://script.google.com/macros/s/AKfycbyffdGc46H_jHntX_HAr20StcO3I_FGLvlJ20dlaMzNnCdMQizZbeGjWHpg2AmxoKOZ/exec";

document.getElementById('go').href = APP_URL;

var ua = navigator.userAgent || '';
var isIOS = /iPad|iPhone|iPod/.test(ua);
var isSafari = isIOS && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
var standalone = window.matchMedia('(display-mode: standalone)').matches
              || window.navigator.standalone === true;

var hint = document.getElementById('hint');

if (standalone) {
  // 이미 앱으로 설치해서 실행한 경우 → 바로 스튜디오로
  hint.style.display = 'none';
  setTimeout(function(){ location.replace(APP_URL); }, 400);
} else if (isIOS) {
  if (isSafari) {
    hint.innerHTML = '<b>홈 화면에 추가하는 방법</b><br>'
      + '① 화면 아래 공유 버튼 <b>↑</b> 누르기<br>'
      + '② 아래로 내려서 <b>“홈 화면에 추가”</b> 선택<br>'
      + '③ 오른쪽 위 <b>추가</b> 누르면 완료';
  } else {
    hint.innerHTML = '<b>아이폰은 사파리로 열어야 설치돼요.</b><br>'
      + '주소를 복사해서 사파리에서 다시 열어주세요.';
  }
} else {
  hint.innerHTML = '<b>홈 화면에 추가하는 방법</b><br>'
    + '아래 <b>“홈 화면에 앱으로 설치”</b> 버튼을 눌러주세요.<br>'
    + '버튼이 안 보이면 브라우저 메뉴 <b>⋮</b> → <b>“앱 설치”</b>를 눌러주세요.';
}

/* 안드로이드 크롬: 설치 버튼 활성화 */
var deferred = null;
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  deferred = e;
  document.getElementById('installWrap').style.display = 'block';
});

document.getElementById('install').addEventListener('click', function () {
  if (!deferred) return;
  deferred.prompt();
  deferred.userChoice.then(function (r) {
    if (r.outcome === 'accepted') {
      document.getElementById('installWrap').style.display = 'none';
      hint.innerHTML = '<b>설치가 시작됐어요.</b><br>홈 화면에서 JS STUDIO 아이콘을 확인해주세요.';
    }
    deferred = null;
  });
});

window.addEventListener('appinstalled', function () {
  document.getElementById('installWrap').style.display = 'none';
  hint.innerHTML = '<b>설치 완료!</b><br>이제 홈 화면 아이콘으로 바로 들어오실 수 있어요.';
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}

/* 캐시가 남아 옛 화면이 뜨는 것을 막기 위해, 스튜디오를 열 때마다 새 주소로 요청 */
document.getElementById('go').addEventListener('click', function (ev) {
  ev.preventDefault();
  var sep = APP_URL.indexOf('?') === -1 ? '?' : '&';
  location.href = APP_URL + sep + 't=' + Date.now();
});
</script>

</body>
</html>
